[project]
name = "notes2latex"
version = "0.1.0"
description = "Convert handwritten math notes to compiled LaTeX using vision LLMs"
readme = "README.md"
authors = [
    { name = "advaypakhale", email = "advay.pakhale@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "langgraph>=1.0.9",
    "litellm>=1.81.15",
    "pillow>=12.1.1",
    "pydantic-settings>=2.13.1",
    "pymupdf>=1.27.1",
    "rich>=14.3.3",
    "tenacity>=9.1.4",
    "typer>=0.24.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.21.0",
    "python-multipart>=0.0.20",
    "alembic>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes2latex"]

[project.scripts]
notes2latex = "notes2latex.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # A docstring that restates the signature is noise; the places that warrant
    # prose already have one.
    "D1",
    # ruff documents both as conflicting with the formatter.
    "COM812",
    "ISC001",
    # Each contradicts a sibling rule (D211, D212) that ruff resolves in favour of.
    "D203",
    "D213",
    # This project does not put copyright headers on files.
    "CPY001",
    # JobStatus and JobPhase subclass str for SQLModel column mapping; StrEnum
    # would change what str() returns for them.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Asserting is what a test does, and the expected values it asserts against are the
# point of the test rather than magic numbers to be named.
"tests/**" = ["S101", "PLR2004"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
